name: frontend
description: Resume AI Agent – Flutter UI
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & SSE streaming
  http: ^1.2.2

  # Typography
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/resume-agent-logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/resume-agent-logo.png

flutter_native_splash:
  color: "#0A0D14"
  image: assets/images/resume-agent-logo.png
  android_12:
    color: "#0A0D14"
    image: assets/images/resume-agent-logo.png
