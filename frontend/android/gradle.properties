org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable daemon to prevent lock file conflicts
org.gradle.daemon=false

# Enable build caching
org.gradle.caching=true

# Enable parallel builds
org.gradle.parallel=true

# Required for AGP 8+ with Java 17+
org.gradle.java.installations.auto-detect=false

# Disable AGP 9 automatic SDK component downloads (SDK path is read-only)
android.sdk.channel=0
android.sdk.download.auto=false
android.builder.sdkDownload=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
